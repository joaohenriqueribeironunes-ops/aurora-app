name: aurora_app
description: "Aurora — app focado em pessoas neurodivergentes (TEA/TDAH) com cinco sessões: Foco, Jogos, Frisson, Ideias e Ajustes."
publish_to: "none"
version: 1.0.4+4

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  http: ^1.2.2
  intl: ^0.20.0
  just_audio: ^0.10.3
  file_picker: ^10.1.2
  path_provider: ^2.1.4
  flutter_local_notifications: ^19.0.0
  timezone: ^0.10.0

flutter:
  uses-material-design: true
